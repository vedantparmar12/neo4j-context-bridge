# Cloudflare Workers configuration for Neo4j Light RAG MCP Server
name = "neo4j-lightrag-mcp"
main = "dist/cloudflare-worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker settings
workers_dev = true
route = { pattern = "neo4j-lightrag.your-domain.workers.dev", zone_name = "your-domain.com" }

# Environment variables for production
[env.production]
name = "neo4j-lightrag-mcp-prod"
route = { pattern = "neo4j-lightrag-prod.your-domain.workers.dev", zone_name = "your-domain.com" }

[env.production.vars]
NODE_ENV = "production"
LOG_LEVEL = "warn"
CACHE_ENABLED = "true"
RATE_LIMIT_ENABLED = "true"

# Environment variables for staging
[env.staging]
name = "neo4j-lightrag-mcp-staging"
route = { pattern = "neo4j-lightrag-staging.your-domain.workers.dev", zone_name = "your-domain.com" }

[env.staging.vars]
NODE_ENV = "staging"
LOG_LEVEL = "info"

# Variables (set via wrangler secret put)
# NEO4J_URI - Neo4j connection string
# NEO4J_USER - Neo4j username
# NEO4J_PASSWORD - Neo4j password
# OLLAMA_API_KEY - Ollama API key (if using hosted Ollama)
# MCP_API_KEY - MCP server API key

# KV storage for caching
[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

# D1 database for additional storage (optional)
# [[d1_databases]]
# binding = "DB"
# database_name = "neo4j-lightrag-db"
# database_id = "your-d1-database-id"

# AI binding for Cloudflare AI (alternative to Ollama)
[ai]
binding = "AI"

# Analytics Engine for monitoring
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Worker limits
[limits]
cpu_ms = 50000